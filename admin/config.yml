backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "homepage"
    label: "🏠 Home Page"
    label_singular: "Home Page"
    folder: "data/home"
    create: true
    slug: "home"
    fields:
      - { label: "Hero Title", name: "hero_title", widget: "string", default: "QUALITY EDUCATION!" }
      - { label: "Hero Subtitle", name: "hero_subtitle", widget: "text", default: "A perfect blend of Leadership, Business, Technology & Theology" }
      - { label: "Hero Button Text", name: "hero_button", widget: "string", default: "Apply Now - 100% Scholarship Provided" }
      - { label: "Story Section Title", name: "story_title", widget: "string", default: "WHO WE ARE" }
      - { label: "Story Text", name: "story_text", widget: "text", default: "The Living Oracles of God is a pioneering faith-based e-learning institution..." }
      - { label: "Programs Section Title", name: "programs_title", widget: "string", default: "EMPOWER YOURSELF" }
      - { label: "Programs Text", name: "programs_text", widget: "text", default: "Welcome! We specialize in producing street-smart..." }
      - { label: "Award Title", name: "award_title", widget: "string", default: "🏆 Christian College Award" }
      - { label: "Award Text", name: "award_text", widget: "text", default: "Recognized for instructional model excellence..." }

  - name: "features"
    label: "⭐ Why Study With Us"
    label_singular: "Feature"
    folder: "data/features"
    create: true
    fields:
      - { label: "Icon Class", name: "icon", widget: "string", default: "fas fa-chalkboard-user" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }

  - name: "programs"
    label: "📚 Programs & Courses"
    label_singular: "Program"
    folder: "data/programs"
    create: true
    fields:
      - { label: "School Type", name: "school", widget: "select", options: ["ministry", "business", "tech"] }
      - { label: "Program Name", name: "program_name", widget: "string" }
      - { label: "Courses", name: "courses", widget: "list", field: { label: "Course", name: "course", widget: "string" } }

  - name: "contact"
    label: "📞 Contact Information"
    folder: "data"
    create: false
    fields:
      - { label: "Email", name: "email", widget: "string", default: "info@livingoraclesofgod.com" }
      - { label: "Phone", name: "phone", widget: "string", default: "+233 24 145 6581" }
      - { label: "WhatsApp", name: "whatsapp", widget: "string", default: "+233 24 145 6581" }

  - name: "team"
    label: "👥 Leadership Team"
    folder: "data/team"
    create: true
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Bio", name: "bio", widget: "text", required: false }
